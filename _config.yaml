# site properties and page defaults
title: DSM Biostatistics Unit
# subtitle: University of Trieste
description: An easy-to-use, flexible website template for labs, with automatic citations, GitHub tag imports, pre-built components, and more.
header: images/gaussiana_DSM_blu.jpeg
footer: images/gaussiana_DSM_blu.jpeg
proofer: false

# site social media and other links
#links:
#  github: your-lab

### jekyll settings

# front matter defaults
defaults:
  - scope:
      type: "members"
    values:
      layout: member
  - scope:
      type: "collaborators"
    values:
      layout: member
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  members:
    output: true
  collaborators:
    output: false
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - .venv
  - vendor

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
